# =============================================================================
# Lab 4: Docker Swarm Stack – Self-Healing & Fault Tolerance
# =============================================================================
# Mục đích:
#   Chứng minh Docker Swarm duy trì desired state khi một container bị kill.
#   Service vẫn phải quay lại đủ 3 replicas sau vài giây.
#
# Cách dùng:
#   docker stack deploy -c docker-compose.yml healstack
#   docker service ps healstack_web
#   docker ps --filter label=com.docker.swarm.service.name=healstack_web
#   docker kill <container-id>
# =============================================================================

version: "3.8"

services:
  web:
    image: nginx:1.24-alpine

    ports:
      - "8081:80"

    networks:
      - healnet

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    deploy:
      replicas: 3
      mode: replicated

      resources:
        limits:
          cpus: "0.30"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 32M

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s

      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 20s
        order: start-first

      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
        monitor: 20s
        order: start-first

networks:
  healnet:
    driver: overlay
    attachable: true
